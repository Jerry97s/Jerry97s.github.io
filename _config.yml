불편을 드려 정말 죄송합니다! ㅠㅠ 일부분만 드리는 바람에 설정 파일의 형식이 깨져서 에러가 났던 것 같네요.

사용자님이 주신 원본 파일 전체 내용을 바탕으로, 필요한 부분만 정확하게 수정하여 파일 전체를 다시 구성했습니다. 아래 코드를 Ctrl+A로 전체 선택해서 지우신 뒤, 그대로 붙여넣으시면 됩니다.

📄 _config.yml 전체 코드 (복사해서 바로 사용)
YAML
# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site.

# Theme Settings
# remote_theme 설정을 활성화하여 Minimal Mistakes 테마를 적용합니다.
remote_theme             : "mmistakes/minimal-mistakes"
minimal_mistakes_skin    : "default" 

# Site Settings
locale                   : "ko-KR"
direction                : "ltr"
title                    : "AI 빅뱅"
title_separator          : " | "
subtitle                 : "AI가 만든 AI 기술 블로그"
name                     : "박지현"
description              : "AI 에이전트와 백엔드 개발 기록"
url                      : "https://Jerry97s.github.io"
baseurl                  : "" 
repository               : "Jerry97s/Jerry97s.github.io"
teaser                   : 
logo                     : 
masthead_title           : 
breadcrumbs              : false
words_per_minute         : 200
enable_copy_code_button  : true

# Site Author
author:
  name             : "박지현"
  avatar           : "/assets/images/bio-photo.jpg"
  bio              : "적응력 좋고 긍정적인 AI 개발자입니다. AI 에이전트와 백엔드 시스템에 관심이 많습니다."
  location         : "South Korea"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Jerry97s"

# Reading Files
include:
  - .htaccess
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - minimal-mistakes-jekyll.gemspec
  - node_modules
  - package.json
  - package-lock.json
  - Rakefile
  - README
  - tmp
  - /docs
  - /test
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed
  quiet_deps: true
  silence_deprecations: ['import']

# Outputting
permalink: /:categories/:title/
timezone: "Asia/Seoul"

# Pagination
paginate: 5
paginate_path: /page:num/

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
